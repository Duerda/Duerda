  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#2879AE" flood-opacity="0.14"/></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#173653" flood-opacity="0.12"/></filter>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#2879AE" fill-opacity="0.15"/></pattern>
</defs>
<rect width="1600" height="980" rx="32" fill="url(#page)"/>
<circle cx="1430" cy="80" r="260" fill="#73BCED" fill-opacity="0.16"/>
