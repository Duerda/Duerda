<svg width="1600" height="980" viewBox="0 0 1600 980" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="page" x1="0" y1="0" x2="1600" y2="980" gradientUnits="userSpaceOnUse"><stop stop-color="#F2F9FF"/><stop offset="1" stop-color="#E4F3FF"/></linearGradient>
  <linearGradient id="hero" x1="0" y1="0" x2="780" y2="430" gradientUnits="userSpaceOnUse"><stop stop-color="#173653"/><stop offset="1" stop-color="#2879AE"/></linearGradient>
